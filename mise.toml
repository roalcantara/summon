[tools]
"cargo:https://github.com/RayanBO/todo/" = "tag:v0.2.9"
# Launcher and store icon experiments (ADR-0030). The generator is tools/gen_icons.py.
[tasks."icon:gen"]
description = """Regenerate the launcher icons (all mipmaps, adaptive layers, themed icon) and the \
Play icon from icon art, and write a preview sheet (dark wallpaper, splash colour, white; sizes \
192 to 32 px) to build/icon-preview.png. With no arguments it rebuilds the shipped icon (ADR-0030): the cutout over the violet backdrop \
(layered mode); pass --backdrop "" for flat mode (one opaque square image). Tune the framing with --zoom (art size in \
dp on the 108 dp canvas, 72 dp visible) and --shift (dp to raise the art). --install puts the \
debug build on every connected device; --open shows the preview. Overwrites tracked files under \
app/src/main/res/mipmap-* and docs/play-store/."""
alias = "icon"
usage = '''
arg "[icon]" default="art/icon/cutout.png" help="Icon art: alpha cutout over --backdrop (layered, the shipped icon), or an opaque square with --backdrop \"\" (flat)"
flag "--mono <file>" default="art/icon/cutout.png" help="Alpha cutout for the themed (monochrome) icon"
flag "--backdrop <file>" default="art/icon/backdrop-violet.png" help="Layered mode: opaque background behind the cutout (tools/gen_icon_backdrop.py); empty for flat mode"
flag "--zoom <dp>" default="84" help="Art size in dp on the 108 dp canvas (72 dp visible); 84 is the shipped icon"
flag "--shift <dp>" default="10" help="Raise the art by this many dp; negative lowers it; 10 is the shipped icon"
flag "--preview <file>" default="build/icon-preview.png" help="Preview sheet path"
flag "--install" help="Run ./gradlew installDebug afterwards"
flag "--open" help="Open the preview sheet"
'''
run = '''
set -euo pipefail
args=("${usage_icon}" app/src/main/res/drawable-nodpi/ic_game_logo.webp app/src/main/res docs/play-store
      --mono "${usage_mono}" --zoom "${usage_zoom}" --shift "${usage_shift}" --preview "${usage_preview}")
[ -n "${usage_backdrop:-}" ] && args+=(--backdrop "${usage_backdrop}")
python3 -I tools/gen_icons.py "${args[@]}"
[ "${usage_open:-false}" = "true" ] && open "${usage_preview}"
if [ "${usage_install:-false}" = "true" ]; then ./gradlew installDebug -q; fi
'''

# Play upload (ADR-0017). The script is tools/release_bundle.sh.
[tasks."release:bundle"]
description = """Build the signed release App Bundle for a Play Console upload: bump versionCode \
by one (Play never accepts a code twice, internal testing included), run the unit tests, \
./gradlew bundleRelease, then verify it: jarsigner, signer = the upload key in the keystore, \
manifest version, not debuggable; prints the .aab path, size, SHA-256 and permissions. Needs the \
SUMMON_UPLOAD_* values (env or local.properties) and no uncommitted tracked changes. Undoes the \
bump if anything fails; leaves a successful bump uncommitted. --no-bump rebuilds at the current \
code (only if never uploaded); --name also sets versionName."""
alias = "bundle"
usage = '''
flag "--no-bump" help="Keep the current versionCode (only if it was never uploaded)"
flag "--name <versionName>" help="Also set versionName, e.g. 1.0.1"
'''
run = '''
set -euo pipefail
args=()
[ "${usage_no_bump:-false}" = "true" ] && args+=(--no-bump)
[ -n "${usage_name:-}" ] && args+=(--name "${usage_name}")
tools/release_bundle.sh ${args[@]+"${args[@]}"}  # empty-safe under set -u (bash 3.2)
'''
