demon_asmodeus_appearance:
  - text: 'Trois têtes (taureau, homme, bélier) : chaque réunion tourne au comité. Il crache du feu, a une queue de serpent et des pattes d’oie. Dragon, lance, bannière : la discrétion est pour les Ducs.'
    length: 192
    back_translation: 'Three heads (bull, man, ram): every meeting becomes a committee. He breathes fire, has a serpent tail and goose feet. Dragon, lance, banner: subtlety is for Dukes.'
    reference: 'none'
    note: 'Conserve tous les traits visuels et le trait final sur les Ducs.'
  - text: 'Trois têtes, donc trois avis. Feu, queue de serpent, pattes d’oie ; il parade sur dragon, lance et bannière. La discrétion ? Affaire de Ducs.'
    length: 141
    back_translation: "Three heads, therefore three opinions. Fire, serpent tail, goose feet; he parades on a dragon with lance and banner. Subtlety? A Dukes' affair."
    reference: 'none'
    note: 'Transforme la réunion en désaccord permanent, puis garde sa parade ridicule.'
  - text: 'Taureau, homme, bélier : trois têtes, zéro accord. Feu, queue de serpent, pattes d’oie, dragon, lance et bannière. Les Ducs font dans la finesse.'
    length: 145
    back_translation: 'Bull, man, ram: three heads, zero agreement. Fire, serpent tail, goose feet, dragon, lance and banner. Dukes do subtlety.'
    reference: 'none'
    note: 'Le contraste entre son arsenal voyant et la finesse des Ducs porte la blague.'

demon_asmodeus_restless_quote:
  - text: 'J’ai compté chaque grain de poussière. Deux fois. Trois bases.'
    length: 62
    back_translation: 'I counted every grain of dust. Twice. Three bases.'
    reference: 'none'
    note: 'La chute absurde sur les bases numériques reste intacte.'
  - text: 'J’ai recompté la poussière. Deux fois. En trois bases.'
    length: 54
    back_translation: 'I recounted the dust. Twice. In three bases.'
    reference: 'none'
    note: 'Plus compact, tout aussi maniaque et suffisant.'
  - text: 'La poussière est comptée. Deux fois. En trois bases.'
    length: 52
    back_translation: 'The dust is counted. Twice. In three bases.'
    reference: 'none'
    note: 'Ton pompeux et sec, digne d’un démon qui s’ennuie.'

