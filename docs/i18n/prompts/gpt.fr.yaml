demon_astaroth_secret:
  - text: 'Avant dragon et haleine, son nom fut celui d’Astarte, déesse d’amour et de guerre. Évite le sujet.'
    length: 98
    back_translation: "Before dragon and breath, his name was Astarte's, goddess of love and war. Avoid the subject."
    reference: 'none'
    note: 'Garde le contraste entre son passé divin et son irritation actuelle.'
  - text: 'Avant le dragon, Astarte portait ce nom. Déesse d’amour et de guerre ; il préfère oublier.'
    length: 90
    back_translation: 'Before the dragon, Astarte bore that name. Goddess of love and war; he prefers to forget.'
    reference: 'none'
    note: 'Le dernier segment suggère discrètement son embarras.'
  - text: 'Ce nom fut celui d’Astarte, déesse d’amour et de guerre. Avec l’haleine, il préfère changer de sujet.'
    length: 101
    back_translation: "That name was Astarte's, goddess of love and war. With the breath, he prefers to change the subject."
    reference: 'none'
    note: 'Ajoute une pointe sur son haleine tout en préservant le secret.'

