demon_astaroth_quote:
  - text: 'Je sais ton passé, ton futur, et tes CGU jamais lues.'
    length: 53
    back_translation: 'I know your past, your future, and your terms of service never read.'
    reference: 'terms of service'
    note: 'La mention des CGU rend la prophétie mesquine et moderne.'
  - text: 'Je connais ton passé, ton futur, et tes CGU ignorées.'
    length: 53
    back_translation: 'I know your past, your future, and your ignored terms of service.'
    reference: 'terms of service'
    note: 'Formulation fluide qui garde la moquerie administrative.'
  - text: 'Passé, futur, et CGU non lues : je sais tout.'
    length: 45
    back_translation: 'Past, future, and unread terms of service: I know everything.'
    reference: 'terms of service'
    note: 'Plus sèche et plus vantarde, comme une annonce de devin.'

demon_astaroth_restless_quote:
  - text: 'J’avais prévu l’oubli. J’adore avoir raison. Hélas.'
    length: 51
    back_translation: 'I foresaw the forgetting. I love being right. Alas.'
    reference: 'none'
    note: 'Le faux regret final rend sa satisfaction encore plus agaçante.'
  - text: 'Tu m’oublierais, je le savais. Quelle joie d’avoir raison.'
    length: 58
    back_translation: 'You would forget me, I knew it. What joy to be right.'
    reference: 'none'
    note: 'Conserve le narcissisme prophétique avec une ironie sèche.'
  - text: 'Je savais l’oubli. J’adore avoir raison. Évidemment.'
    length: 52
    back_translation: 'I knew the forgetting. I love being right. Obviously.'
    reference: 'none'
    note: 'Évidemment sert de contradiction goguenarde au prétendu regret.'

